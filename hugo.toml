baseURL = "https://xingvec.github.io/"
languageCode = "zh-cn"
title = "星向 Blog"
theme = "stack"
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[params]
  mainSections = ["post"]
  rssFullContent = true
  favicon = "img/avatar.png"

  [params.footer]
    since = 2026
    customText = ""

  [params.dateFormat]
    published = "January 2, 2006"
    lastUpdated = "January 2, 2006"

  [params.sidebar]
    subtitle = "欢迎来到我的博客"
    avatar = "img/avatar.png"
    emoji = "✏️"

  [params.article]
    toc = true
    readingTime = true
    headingAnchor = true

    [params.article.list]
      showTags = true

    [params.article.license]
      enabled = true
      default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.widgets]
    [[params.widgets.homepage]]
      type = "search"
    [[params.widgets.homepage]]
      type = "archives"
      [params.widgets.homepage.params]
        limit = 5
    [[params.widgets.homepage]]
      type = "categories"
      [params.widgets.homepage.params]
        limit = 10
    [[params.widgets.homepage]]
      type = "tag-cloud"
      [params.widgets.homepage.params]
        limit = 10

    [[params.widgets.page]]
      type = "toc"

[[menu.main]]
  name = "首页"
  url = "/"
  weight = 1
  [menu.main.params]
    icon = "home"

[[menu.main]]
  name = "文章"
  url = "/post/"
  weight = 2
  [menu.main.params]
    icon = "archives"

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 3
  [menu.main.params]
    icon = "clock"

[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 4
  [menu.main.params]
    icon = "search"

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 5
  [menu.main.params]
    icon = "user"

[[menu.social]]
  name = "GitHub"
  url = "https://github.com/xingvec"
  [menu.social.params]
    icon = "brand-github"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"]]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2

  [markup.highlight]
    style = "monokai"
    lineNos = true
    codeFences = true
    guessSyntax = true
    noClasses = false
    lineNumbersInTable = true
    tabWidth = 4
