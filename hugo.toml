baseURL = "https://xingvec.github.io/"
languageCode = "zh-cn"
title = "星向 Blog"
theme = "stack"

[params]
  mainSections = ["post"]
  rssFullContent = true
  favicon = "img/avatar.png"

  [params.sidebar]
    subtitle = "欢迎来到我的博客"
    avatar = "img/avatar.png"

  [params.article]
    toc = true
    readingTime = true

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.widgets]
    [[params.widgets.homepage]]
      type = "search"
    [[params.widgets.homepage]]
      type = "archives"
      [params.widgets.homepage.params]
        limit = 5
    [[params.widgets.homepage]]
      type = "categories"
      [params.widgets.homepage.params]
        limit = 10
    [[params.widgets.homepage]]
      type = "tag-cloud"
      [params.widgets.homepage.params]
        limit = 10

[[menu.main]]
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  name = "文章"
  url = "/post/"
  weight = 2

[[menu.main]]
  name = "关于"
  url = "/page/about/"
  weight = 3

[[menu.social]]
  name = "GitHub"
  url = "https://github.com/xingvec"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    codeFences = true
    guessSyntax = true
